<style>

 lg.innerHTML=logs.filter(x=>filt==='all'||x.l===filt||x.l==='sys').map(x=>`<div class="l-${x.l}">${esc(x.t)}</div>`).join('');if(b)lg.scrollTop=lg.scrollHeight;$('#eb').textContent=errs||''}))}
$('#bc').onclick=()=>$('#con').classList.toggle('open');$('#cx').onclick=()=>$('#con').classList.remove('open');
$('#cc').onclick=()=>{logs=[];errs=0;drawLog()};
$('#con').onclick=e=>{const f=e.target.dataset.f;if(!f)return;filt=f;document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===f));drawLog()};

document.querySelectorAll('nav [data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode('split');
let zm=false,kb=false,H0=0;
const zen=()=>document.body.classList.toggle('zen',zm||(cfg.kbzen&&kb)),vv=window.visualViewport||{height:innerHeight,addEventListener(){}},
fit=()=>{const f=/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);if(!f||!H0)H0=vv.height;kb=f&&vv.height<H0-120;document.documentElement.style.setProperty('--vh',vv.height+'px');document.body.classList.toggle('kb',kb);zen()};
vv.addEventListener('resize',fit);addEventListener('focusin',()=>setTimeout(fit,350));addEventListener('focusout',()=>setTimeout(fit,350));fit();

$('#zx').onclick=()=>{zm=false;kb=false;document.activeElement.blur();zen();setTimeout(fit,400)};
const MD=['editor','split','preview'];$('#zm').onclick=()=>setMode(MD[(MD.indexOf($('#app').dataset.mode)+1)%3]);
// divisor arrastável entre código e preview
const dvd=$('#dvd');let dg=0;
dvd.onpointerdown=e=>{dg=1;dvd.setPointerCapture(e.pointerId);document.body.classList.add('dg')};
dvd.onpointermove=e=>{if(!dg)return;const r=$('#main').getBoundingClientRect(),row=matchMedia('(min-aspect-ratio:1/1)').matches;cfg.sp=Math.min(.88,Math.max(.1,row?(e.clientX-r.left-11)/r.width:(e.clientY-r.top-11)/r.height));applyCfg(0)};
dvd.onpointerup=dvd.onpointercancel=()=>{dg=0;document.body.classList.remove('dg');applyCfg()};
dvd.ondblclick=()=>{cfg.sp=.5;applyCfg()};
// ---------- projetos, importar, exportar ----------
async function load(p){P=p;P.dirs=P.dirs||[];open=[];cur=null;curDir='';E.reset();localStorage.setItem('nc:last',P.id);
 const t=k=>'t' in P.files[k],e=P.files['index.html']&&t('index.html')?'index.html':Object.keys(P.files).find(k=>/\.html?$/i.test(k)&&t(k))||Object.keys(P.files).find(t);
 if(e)openFile(e);else{E.open('','');tabs();tree()}ui();run()}
async function newProject(name,files){const p=mk(name,files);await dbPut(p);await load(p)}
let zipP;const loadZip=()=>zipP||(zipP=new Promise((ok,no)=>{if(window.JSZip)return ok(JSZip);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=()=>ok(JSZip);s.onerror=()=>{zipP=0;no(new Error('Sem internet para carregar o JSZip'))};document.head.append(s)}));
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
async function addFiles(list,np){
 try{const it=[];for(const f of list){if(/\.zip$/i.test(f.name)){const z=await(await loadZip()).loadAsync(f);for(const[n,e]of Object.entries(z.files))if(!e.dir&&!/^__MACOSX/.test(n))it.push({p:n,b:await e.async('blob')})}else it.push({p:f.webkitRelativePath||f.name,b:f})}
 if(!it.length)return;const ps=it.map(i=>norm(i.p)),r=ps[0].split('/')[0];if(ps.every(p=>p.includes('/')&&p.split('/')[0]===r))ps.forEach((p,i)=>ps[i]=p.slice(r.length+1));
 const files={};for(let i=0;i<it.length;i++)files[ps[i]]=TXT.test(ps[i])?{t:await it[i].b.text()}:{b:it[i].b};
 if(np)await newProject(list[0].name.replace(/\.[^.]+$/,'')||'Projeto',files);else{Object.assign(P.files,files);touch();run();toast(it.length+' arquivo(s) importado(s)')}
 }catch(e){toast('Erro ao importar: '+e.message)}}
$('#fi').onchange=$('#fd').onchange=e=>{addFiles([...e.target.files],e.target.dataset.np==='1');e.target.value=''};
const pick=(id,np)=>{const i=$(id);i.dataset.np=np?1:0;i.click()};
async function exportZip(){try{const Z=await loadZip(),z=new Z();for(const p in P.files){const f=P.files[p];z.file(p,'t' in f?f.t:f.b)}P.dirs.forEach(d=>z.folder(d));dl(await z.generateAsync({type:'blob'}),P.name+'.zip')}catch(e){toast(e.message)}}
const D=$('#dlg');
function dlg(t,h,on){D.innerHTML=`<div class="dh"><b>${t}</b><button data-c>✕</button></div><div class="db">${h}</div>`;
 D.onclick=e=>{const b=e.target.closest('[data-c],[data-do]');if(e.target===D||(b&&b.hasAttribute('data-c')))D.close();else if(b&&on)on(b.dataset.do)};D.onchange=e=>on&&on('chg',e.target);if(!D.open)D.showModal()}
async function projetos(){const l=(await dbAll()).sort((a,b)=>b.upd-a.upd);
 dlg('Projetos',`<button class="pri" data-do="ex">＋ Novo projeto de exemplo</button><button data-do="em">＋ Novo projeto vazio</button><button data-do="im">⬆ Importar como novo projeto (HTML, ZIP…)</button><button data-do="ip">⬆ Importar pasta como novo projeto</button>`+
  l.map(p=>`<div class="pr"><button data-do="o:${p.id}">${esc(p.name)}<br><small>${new Date(p.upd).toLocaleString('pt-BR')}${p.id===P.id?' · aberto':''}</small></button><button data-do="d:${p.id}">🗑</button></div>`).join(''),
 async a=>{const[k,id]=a.split(':');
  if(k==='ex'){D.close();await newProject('Jogo de exemplo',sample())}
  else if(k==='em'){const n=prompt('Nome do projeto:','Novo projeto');if(n){D.close();await newProject(n,{'index.html':{t:'<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>'+esc(n)+'</title></head>\n<body>\n\n</body></html>'}})}}
  else if(k==='im'){D.close();pick('#fi',1)}else if(k==='ip'){D.close();pick('#fd',1)}
  else if(k==='o'){D.close();await save();await load(await dbGet(id))}
  else if(k==='d'){if(!confirm('Excluir este projeto?'))return;await dbDel(id);if(id===P.id){D.close();const r=(await dbAll())[0];await(r?load(r):newProject('Jogo de exemplo',sample()))}else projetos()}})}
$('#pn').onclick=projetos;
function menu(){dlg('Menu',`<button data-do="s">💾 Salvar agora</button><button data-do="f">🔍 Buscar / substituir</button><button data-do="i">⬆ Importar arquivos / ZIP</button><button data-do="ip">⬆ Importar pasta</button><button data-do="z">⬇ Exportar projeto (ZIP)</button><button data-do="a">⬇ Exportar arquivo atual</button><button data-do="g">🐙 GitHub: enviar / baixar</button><button data-do="r">✎ Renomear projeto</button><button data-do="c">⚙ Configurações</button><button data-do="u">🔄 Verificar atualização</button><button data-do="h">❓ Ajuda</button><small>Versão ${APP_V} · ${esc(localStorage.getItem('nekoCodeMsg')||'aberto direto (sem atualização automática)')}</small>`,async a=>{D.close();
  if(a==='s'){await save();toast('Salvo')}else if(a==='f')E.find();else if(a==='i')pick('#fi',0);else if(a==='ip')pick('#fd',0);else if(a==='z')exportZip();
  else if(a==='a'&&cur)dl(new Blob([P.files[cur].t],{type:mime(cur)}),cur.split('/').pop());
  else if(a==='r'){const n=prompt('Nome do projeto:',P.name);if(n){P.name=n;dirty=true;save();}}else if(a==='c')config();else if(a==='g')github();else if(a==='h')ajuda();else if(a==='u')location.reload()})}
$('#bm').onclick=menu;
function config(){dlg('Configurações',`<label>Atualizar preview automaticamente<input type="checkbox" data-k="auto" ${cfg.auto?'checked':''}></label><label>Atraso (ms)<input type="number" data-k="delay" min="200" max="5000" step="100" value="${cfg.delay}"></label><label>Quebrar linhas longas<input type="checkbox" data-k="wrap" ${cfg.wrap?'checked':''}></label><label>Modo foco automático com o teclado<input type="checkbox" data-k="kbzen" ${cfg.kbzen?'checked':''}></label><label>Tamanho da fonte<input type="number" data-k="font" min="10" max="24" value="${cfg.font}"></label><label>Permitir localStorage no jogo (same-origin)<input type="checkbox" data-k="same" ${cfg.same?'checked':''}></label><small>Link de atualização automática (arquivo no GitHub Pages)</small><input data-u="1" placeholder="https://usuario.github.io/repo/index.html" value="${esc(localStorage.getItem('nekoCodeURL')||'')}" autocomplete="off"><small>Same-origin é necessário para jogos que usam localStorage/IndexedDB (como o Neko Tower), mas dá ao código do projeto acesso aos dados do editor. Desligue para rodar código de terceiros. Vale na próxima execução.</small>`,(a,el)=>{if(a!=='chg')return;if(el.dataset.u!==undefined){localStorage.setItem('nekoCodeURL',el.value.trim());return}cfg[el.dataset.k]=el.type==='checkbox'?el.checked:+el.value;applyCfg()})}
function ajuda(){dlg('Ajuda',`<b>Live Preview</b><span>Edite e o preview recarrega sozinho após uma pausa na digitação. ▶ Rodar ou ↻ reinicia do zero.</span><b>Divisor</b><span>Na tela dividida, arraste a barra ••• para subir/descer (ou ir para o lado) cada tela. Toque duplo volta para 50/50.</span><b>Modo foco</b><span>⛶ Foco esconde todas as barras e deixa só código + preview. Ele liga sozinho quando o teclado abre (dá para desligar em ⚙). No canto superior direito ficam ▶ rodar, ◧ trocar modo e ✕ sair.</span><b>Barra de símbolos</b><span>Aparece junto do teclado: Tab, desfazer/refazer, { } ( ) [ ] &lt; &gt; ; " e busca. O editor também indenta sozinho e fecha parênteses, aspas e tags.</span><b>Neko Tower</b><span>Projetos → “Importar como novo projeto” → escolha o index.html. Avisos sobre localhost:7700 são normais: esse servidor existe só dentro do APK, e o jogo usa o plano B da CDN.</span><b>GitHub</b><span>Menu ⋯ → GitHub: cole o token uma vez (fica só neste celular), informe usuario/repo e toque em Enviar para fazer commit só dos arquivos que mudaram, ou em Baixar para abrir um repositório como novo projeto.</span><b>Autocompletar</b><span>Com 2+ letras aparecem sugestões em botões embaixo do editor (palavras do arquivo, JS/Babylon, CSS e tags). Toque para completar.</span><b>Atualização automática</b><span>No app (APK), ao abrir ele confere o link de atualização (⚙) e baixa a versão nova do GitHub Pages sozinho. Suba o novo arquivo como index.html e aumente o número APP_V. Se a versão nova falhar 2 vezes ao abrir, volta para a do APK.</span><b>Atalhos</b><span>Ctrl+S salvar · Ctrl+Enter executar · Ctrl+F buscar · Tab / Shift+Tab indentar.</span><b>Limitações</b><span>Scripts type="module" com import relativo entre arquivos não funcionam. Linhas de scripts inline são relativas ao HTML processado. Sem service worker, url() no CSS e fetch() de arquivos locais não enxergam o projeto.</span>`)}
// ---------- GitHub (API REST direto do navegador, sem servidor) ----------
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},gdir=d=>d?d.replace(/^\/+|\/+$/g,'')+'/':'';
async function gh(path,o={}){const r=await fetch('https://api.github.com'+path,{method:o.m||'GET',headers:{Authorization:'Bearer '+localStorage.getItem('nc:tok'),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:o.b?JSON.stringify(o.b):undefined}),j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error((j.message||'HTTP '+r.status)+(r.status===401?' (token inválido)':r.status===404?' (repositório/branch não encontrado ou sem acesso)':''));return j}
async function ghPush(msg,say){const{r,b,d}=P.gh,dir=gdir(d),te=new TextEncoder(),have={},ch=[];say('Lendo '+r+'@'+b+'…');
 const ref=await gh(`/repos/${r}/git/ref/heads/${b}`),cm=await gh(`/repos/${r}/git/commits/${ref.object.sha}`),tr=await gh(`/repos/${r}/git/trees/${cm.tree.sha}?recursive=1`);
 tr.tree.forEach(x=>have[x.path]=x.sha);
 for(const p in P.files){const f=P.files[p],u='t' in f?te.encode(f.t):new Uint8Array(await f.b.arrayBuffer()),h=te.encode('blob '+u.length+'\0'),a=new Uint8Array(h.length+u.length);a.set(h);a.set(u,h.length);
  const sha=[...new Uint8Array(await crypto.subtle.digest('SHA-1',a))].map(x=>x.toString(16).padStart(2,'0')).join('');if(have[dir+p]!==sha)ch.push({p:dir+p,u})}
 if(!ch.length)return say('Nada para enviar: o repositório já está igual a este projeto.');
 const it=[];for(const c of ch){say(`Enviando ${it.length+1}/${ch.length}: ${c.p}`);it.push({path:c.p,mode:'100644',type:'blob',sha:(await gh(`/repos/${r}/git/blobs`,{m:'POST',b:{content:b64(c.u),encoding:'base64'}})).sha})}
 const nt=await gh(`/repos/${r}/git/trees`,{m:'POST',b:{base_tree:cm.tree.sha,tree:it}}),nc=await gh(`/repos/${r}/git/commits`,{m:'POST',b:{message:msg,tree:nt.sha,parents:[ref.object.sha]}});
 await gh(`/repos/${r}/git/refs/heads/${b}`,{m:'PATCH',b:{sha:nc.sha}});say('✓ Commit enviado ('+ch.length+' arquivo(s)). No GitHub Pages, a publicação leva cerca de 1 minuto.')}
async function ghPull(cf,say){const{r,b,d}=cf,dir=gdir(d);say('Lendo '+r+'@'+b+'…');
 const fl=(await gh(`/repos/${r}/git/trees/${b}?recursive=1`)).tree.filter(x=>x.type==='blob'&&x.path.startsWith(dir)&&(x.size||0)<5e6);
 if(!fl.length)throw new Error('Nenhum arquivo nessa pasta/branch');if(fl.length>200)throw new Error(fl.length+' arquivos: informe uma pasta menor');
 const files={};let n=0;for(const x of fl){say(`Baixando ${++n}/${fl.length}`);const j=await gh(`/repos/${r}/git/blobs/${x.sha}`),u=Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0)),p=x.path.slice(dir.length);files[p]=TXT.test(p)?{t:new TextDecoder().decode(u)}:{b:new Blob([u],{type:mime(p)})}}
 await newProject(r.split('/')[1],files);P.gh=cf;dirty=true;await save();say('✓ Projeto "'+P.name+'" criado com '+fl.length+' arquivo(s).')}
function github(){const g=P.gh||{r:'',b:'main',d:''};
 dlg('GitHub',`<small>Envie este projeto para um repositório (commit só dos arquivos que mudaram) ou baixe um repositório como novo projeto. O token fica guardado só neste celular e precisa de permissão de escrita em Contents.</small><input id="gt" type="password" placeholder="Token de acesso (ghp_… ou github_pat_…)" value="${esc(localStorage.getItem('nc:tok')||'')}" autocomplete="off"><input id="gr" placeholder="usuario/repositorio" value="${esc(g.r)}" autocomplete="off"><div class="rw"><input id="gb" placeholder="branch" value="${esc(g.b)}"><input id="gd" placeholder="pasta (opcional)" value="${esc(g.d)}"></div><input id="gm" placeholder="Mensagem do commit" value="Atualização pelo Neko Code Studio"><button class="pri" data-do="up">⬆ Enviar projeto</button><button data-do="dn">⬇ Baixar como novo projeto</button><div id="ghs" class="mu"></div>`,
 async a=>{if(a!=='up'&&a!=='dn')return;const v=i=>$('#'+i).value.trim(),say=t=>{const e=$('#ghs');if(e)e.textContent=t},r=v('gr').replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,''),cf={r,b:v('gb')||'main',d:v('gd')};
  if(!v('gt')||!/^[^\/\s]+\/[^\/\s]+$/.test(r))return say('Preencha o token e o repositório (usuario/repo).');
  localStorage.setItem('nc:tok',v('gt'));try{if(a==='up'){P.gh=cf;dirty=true;await save();await ghPush(v('gm')||'Atualização',say)}else await ghPull(cf,say)}catch(e){say('Erro: '+e.message)}})}

// ---------- atalhos e ciclo de vida ----------
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save().then(()=>toast('Salvo'))}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)save()});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
// ---------- boot ----------
E=await makeEditor($('#ed'));
const last=localStorage.getItem('nc:last');let p0=last?await dbGet(last).catch(()=>0):0;
if(!p0){p0=mk('Jogo de exemplo',sample());await dbPut(p0)}
await load(p0);
try{localStorage.setItem('nekoCodeTry',0)}catch(e){}
