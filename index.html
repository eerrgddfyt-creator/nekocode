<style>

 if(np)await newProject(list[0].name.replace(/\.[^.]+$/,'')||'Projeto',files);else{Object.assign(P.files,files);touch();run();toast(it.length+' arquivo(s) importado(s)')}
 }catch(e){toast('Erro ao importar: '+e.message)}}
$('#fi').onchange=$('#fd').onchange=e=>{addFiles([...e.target.files],e.target.dataset.np==='1');e.target.value=''};
const pick=(id,np)=>{const i=$(id);i.dataset.np=np?1:0;i.click()};
async function exportZip(){try{const Z=await loadZip(),z=new Z();for(const p in P.files){const f=P.files[p];z.file(p,'t' in f?f.t:f.b)}P.dirs.forEach(d=>z.folder(d));dl(await z.generateAsync({type:'blob'}),P.name+'.zip')}catch(e){toast(e.message)}}
const D=$('#dlg');
function dlg(t,h,on){D.innerHTML=`<div class="dh"><b>${t}</b><button data-c aria-label="Fechar">${I('x')}</button></div><div class="db">${h}</div>`;
 D.onclick=e=>{const b=e.target.closest('[data-c],[data-do]');if(e.target===D||(b&&b.hasAttribute('data-c')))D.close();else if(b&&on)on(b.dataset.do)};D.onchange=e=>on&&on('chg',e.target);if(!D.open)D.showModal()}
async function projetos(){const l=(await dbAll()).sort((a,b)=>b.upd-a.upd);
 dlg('Projetos',`<button class="pri" data-do="ex">${I('plus')}Novo projeto de exemplo</button><button data-do="em">${I('plus')}Novo projeto vazio</button><button data-do="im">${I('upload')}Importar como novo projeto (HTML, ZIP…)</button><button data-do="ip">${I('upload')}Importar pasta como novo projeto</button>`+
  l.map(p=>`<div class="pr"><button data-do="o:${p.id}">${esc(p.name)}<br><small>${new Date(p.upd).toLocaleString('pt-BR')}${p.id===P.id?' · aberto':''}</small></button><button data-do="d:${p.id}" aria-label="Excluir">${I('trash')}</button></div>`).join(''),
 async a=>{const[k,id]=a.split(':');
  if(k==='ex'){D.close();await newProject('Jogo de exemplo',sample())}
  else if(k==='em'){const n=prompt('Nome do projeto:','Novo projeto');if(n){D.close();await newProject(n,{'index.html':{t:'<!DOCTYPE html>\n<html><head><meta charset="utf-8"><title>'+esc(n)+'</title></head>\n<body>\n\n</body></html>'}})}}
  else if(k==='im'){D.close();pick('#fi',1)}else if(k==='ip'){D.close();pick('#fd',1)}
  else if(k==='o'){D.close();await save();await load(await dbGet(id))}
  else if(k==='d'){if(!confirm('Excluir este projeto?'))return;await dbDel(id);if(id===P.id){D.close();const r=(await dbAll())[0];await(r?load(r):newProject('Jogo de exemplo',sample()))}else projetos()}})}
$('#pn').onclick=projetos;
function menu(){dlg('Menu',`<button data-do="s">${I('save')}Salvar agora</button><button data-do="f">${I('search')}Buscar / substituir</button><button data-do="i">${I('upload')}Importar arquivos / ZIP</button><button data-do="ip">${I('upload')}Importar pasta</button><button data-do="z">${I('download')}Exportar projeto (ZIP)</button><button data-do="a">${I('download')}Exportar arquivo atual</button><button data-do="g">${I('github')}GitHub: enviar / baixar</button><button data-do="r">${I('pencil')}Renomear projeto</button><button data-do="c">${I('sliders')}Configurações</button><button data-do="u">${I('sync')}Verificar atualização</button><button data-do="h">${I('help')}Ajuda</button><small>Versão ${APP_V} · ${esc(localStorage.getItem('nekoCodeMsg')||'aberto direto (sem atualização automática)')}</small>`,async a=>{D.close();
  if(a==='s'){await save();toast('Salvo')}else if(a==='f')E.find();else if(a==='i')pick('#fi',0);else if(a==='ip')pick('#fd',0);else if(a==='z')exportZip();
  else if(a==='a'&&cur)dl(new Blob([P.files[cur].t],{type:mime(cur)}),cur.split('/').pop());
  else if(a==='r'){const n=prompt('Nome do projeto:',P.name);if(n){P.name=n;dirty=true;save();}}else if(a==='c')config();else if(a==='g')github();else if(a==='h')ajuda();else if(a==='u')location.reload()})}
$('#bm').onclick=menu;
function config(){dlg('Configurações',`<label>Atualizar preview automaticamente<input type="checkbox" data-k="auto" ${cfg.auto?'checked':''}></label><label>Atraso (ms)<input type="number" data-k="delay" min="200" max="5000" step="100" value="${cfg.delay}"></label><label>Quebrar linhas longas<input type="checkbox" data-k="wrap" ${cfg.wrap?'checked':''}></label><label>Modo foco automático com o teclado<input type="checkbox" data-k="kbzen" ${cfg.kbzen?'checked':''}></label><label>Tamanho da fonte<input type="number" data-k="font" min="10" max="24" value="${cfg.font}"></label><label>Permitir localStorage no jogo (same-origin)<input type="checkbox" data-k="same" ${cfg.same?'checked':''}></label><small>Link de atualização automática (arquivo no GitHub Pages)</small><input data-u="1" placeholder="https://usuario.github.io/repo/index.html" value="${esc(localStorage.getItem('nekoCodeURL')||'')}" autocomplete="off"><small>Same-origin é necessário para jogos que usam localStorage/IndexedDB (como o Neko Tower), mas dá ao código do projeto acesso aos dados do editor. Desligue para rodar código de terceiros. Vale na próxima execução.</small>`,(a,el)=>{if(a!=='chg')return;if(el.dataset.u!==undefined){localStorage.setItem('nekoCodeURL',el.value.trim());return}cfg[el.dataset.k]=el.type==='checkbox'?el.checked:+el.value;applyCfg()})}
function ajuda(){dlg('Ajuda',`<b>Live Preview</b><span>Edite e o preview recarrega sozinho depois de uma pausa na digitação. Rodar ou Reiniciar executa do zero.</span><b>Divisor</b><span>Na tela dividida, arraste a barra do meio para subir/descer cada tela (ou para o lado, em paisagem). Toque duplo volta para 50/50.</span><b>Modo foco</b><span>O botão Foco esconde todas as barras e deixa só código + preview. Ele liga sozinho quando o teclado abre (dá para desligar em Configurações). No canto superior direito ficam rodar, trocar modo e sair do foco.</span><b>Autocompletar</b><span>Com 2+ letras aparecem sugestões em botões embaixo do editor. Em HTML, digite &lt; para ver as tags (ao tocar, ele já fecha a tag) e dê espaço dentro da tag para ver os atributos. Dentro de &lt;script&gt; sugere JS e Babylon; no CSS e dentro de &lt;style&gt;, as propriedades.</span><b>Barra de símbolos</b><span>Aparece junto do teclado: Tab, desfazer/refazer, chaves, parênteses, aspas e busca. O editor também indenta sozinho e fecha parênteses, aspas e tags.</span><b>GitHub</b><span>Menu → GitHub: cole o token uma vez (fica só neste celular), informe usuario/repo e toque em Enviar para fazer commit só dos arquivos que mudaram, ou em Baixar para abrir um repositório como novo projeto.</span><b>Atualização automática</b><span>No app (APK), ao abrir ele confere o link de atualização (Configurações) e baixa a versão nova do GitHub Pages sozinho. Suba o novo arquivo como index.html e aumente o número APP_V. Se a versão nova falhar 2 vezes ao abrir, volta para a do APK.</span><b>Neko Tower</b><span>Projetos → Importar como novo projeto → escolha o index.html. Avisos sobre localhost:7700 são normais: esse servidor existe só dentro do APK, e o jogo usa o plano B da CDN.</span><b>Atalhos</b><span>Ctrl+S salvar · Ctrl+Enter executar · Ctrl+F buscar · Tab / Shift+Tab indentar.</span><b>Limitações</b><span>Scripts type="module" com import relativo entre arquivos não funcionam. Linhas de scripts inline são relativas ao HTML processado. Sem service worker, url() no CSS e fetch() de arquivos locais não enxergam o projeto.</span>`)}
// ---------- GitHub (API REST direto do navegador, sem servidor) ----------
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},gdir=d=>d?d.replace(/^\/+|\/+$/g,'')+'/':'';
async function gh(path,o={}){const r=await fetch('https://api.github.com'+path,{method:o.m||'GET',headers:{Authorization:'Bearer '+localStorage.getItem('nc:tok'),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:o.b?JSON.stringify(o.b):undefined}),j=await r.json().catch(()=>({}));
 if(!r.ok){const m=j.message||'';throw new Error(/empty/i.test(m)||r.status===409?'Repositório vazio: crie um arquivo (ex.: README) pelo site do GitHub e tente de novo.':r.status===401?'Token inválido ou expirado. Gere outro no GitHub e cole de novo.':r.status===403?'Sem permissão. No token, em Repository permissions, deixe Contents em "Read and write" e inclua este repositório.':r.status===404?'Não achei o repositório ou a branch. Confira o nome (usuario/repo), a branch e se o token tem acesso a esse repositório.':m||'HTTP '+r.status)}return j}
async function ghPush(msg,say){const{r,b,d}=P.gh,dir=gdir(d),te=new TextEncoder(),have={},ch=[];say('Lendo '+r+'@'+b+'…');
 const ref=await gh(`/repos/${r}/git/ref/heads/${b}`),cm=await gh(`/repos/${r}/git/commits/${ref.object.sha}`),tr=await gh(`/repos/${r}/git/trees/${cm.tree.sha}?recursive=1`);
 tr.tree.forEach(x=>have[x.path]=x.sha);
 for(const p in P.files){const f=P.files[p],u='t' in f?te.encode(f.t):new Uint8Array(await f.b.arrayBuffer()),h=te.encode('blob '+u.length+'\0'),a=new Uint8Array(h.length+u.length);a.set(h);a.set(u,h.length);
  const sha=[...new Uint8Array(await crypto.subtle.digest('SHA-1',a))].map(x=>x.toString(16).padStart(2,'0')).join('');if(have[dir+p]!==sha)ch.push({p:dir+p,u})}
 if(!ch.length)return say('Nada para enviar: o repositório já está igual a este projeto.');
 const it=[];for(const c of ch){say(`Enviando ${it.length+1}/${ch.length}: ${c.p}`);it.push({path:c.p,mode:'100644',type:'blob',sha:(await gh(`/repos/${r}/git/blobs`,{m:'POST',b:{content:b64(c.u),encoding:'base64'}})).sha})}
 const nt=await gh(`/repos/${r}/git/trees`,{m:'POST',b:{base_tree:cm.tree.sha,tree:it}}),nc=await gh(`/repos/${r}/git/commits`,{m:'POST',b:{message:msg,tree:nt.sha,parents:[ref.object.sha]}});
 await gh(`/repos/${r}/git/refs/heads/${b}`,{m:'PATCH',b:{sha:nc.sha}});say('Commit enviado ('+ch.length+' arquivo(s)). No GitHub Pages, a publicação leva cerca de 1 minuto.')}
async function ghPull(cf,say){const{r,b,d}=cf,dir=gdir(d);say('Lendo '+r+'@'+b+'…');
 const fl=(await gh(`/repos/${r}/git/trees/${b}?recursive=1`)).tree.filter(x=>x.type==='blob'&&x.path.startsWith(dir)&&(x.size||0)<5e6);
 if(!fl.length)throw new Error('Nenhum arquivo nessa pasta/branch');if(fl.length>200)throw new Error(fl.length+' arquivos: informe uma pasta menor');
 const files={};let n=0;for(const x of fl){say(`Baixando ${++n}/${fl.length}`);const j=await gh(`/repos/${r}/git/blobs/${x.sha}`),u=Uint8Array.from(atob(j.content.replace(/\s/g,'')),c=>c.charCodeAt(0)),p=x.path.slice(dir.length);files[p]=TXT.test(p)?{t:new TextDecoder().decode(u)}:{b:new Blob([u],{type:mime(p)})}}
 await newProject(r.split('/')[1],files);P.gh=cf;dirty=true;await save();say('Projeto "'+P.name+'" criado com '+fl.length+' arquivo(s).')}
function github(){const g=P.gh||{r:'',b:'main',d:''};
 dlg('GitHub',`<small><b>Como conseguir o token:</b> github.com → sua foto → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token. Em "Repository access" escolha só o seu repositório e, em Repository permissions, deixe <b>Contents: Read and write</b>. Copie o token (aparece uma vez só). Ele fica guardado só neste celular.</small><input id="gt" type="password" placeholder="Token de acesso (ghp_… ou github_pat_…)" value="${esc(localStorage.getItem('nc:tok')||'')}" autocomplete="off"><input id="gr" placeholder="usuario/repositorio" value="${esc(g.r)}" autocomplete="off"><div class="rw"><input id="gb" placeholder="branch" value="${esc(g.b)}"><input id="gd" placeholder="pasta (opcional)" value="${esc(g.d)}"></div><input id="gm" placeholder="Mensagem do commit" value="Atualização pelo Neko Code Studio"><button class="pri" data-do="up">${I('upload')}Enviar projeto</button><button data-do="dn">${I('download')}Baixar como novo projeto</button><div id="ghs" class="mu"></div>`,
 async a=>{if(a!=='up'&&a!=='dn')return;const v=i=>$('#'+i).value.trim(),say=t=>{const e=$('#ghs');if(e)e.textContent=t},r=v('gr').replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,''),cf={r,b:v('gb')||'main',d:v('gd')};
  if(!v('gt')||!/^[^\/\s]+\/[^\/\s]+$/.test(r))return say('Preencha o token e o repositório (usuario/repo).');
  localStorage.setItem('nc:tok',v('gt'));try{if(a==='up'){P.gh=cf;dirty=true;await save();await ghPush(v('gm')||'Atualização',say)}else await ghPull(cf,say)}catch(e){say('Erro: '+e.message)}})}

addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save().then(()=>toast('Salvo'))}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});

const last=localStorage.getItem('nc:last');let p0=last?await dbGet(last).catch(()=>0):0;
if(!p0){p0=mk('Jogo de exemplo',sample());await dbPut(p0)}
await load(p0);
